server.document-root = "/htdocs"
server.port = 80
server.modules = ("mod_cgi","mod_alias","mod_accesslog")
server.modules += ("mod_proxy","mod_rewrite")

alias.url = ("/files/" => "/target/")

# 専用CGIでHTML描画
$HTTP["url"] =~ "^/files/.+\.md$" {
  url.rewrite-once = ("^/files/(.+\.md)$" => "/mdview.cgi?f=$1")
}
$HTTP["url"] =~ "^/files/.+\.txt$" {
  url.rewrite-once = ("^/files/(.+\.txt)$" => "/mdview.cgi?f=$1")
}
# 末尾スラッシュ(ディレクトリ)は専用CGIで安全に一覧表示
$HTTP["url"] =~ "^/files/([^?]*/)?$" {
  url.rewrite-once = (
    "^/files/(.*)/$" => "/dirview.cgi?d=$1",
    "^/files/$"      => "/dirview.cgi?d="
  )
}

index-file.names = ("estseek.cgi")
accesslog.filename = "/dev/stderr"

cgi.assign = (".cgi" => "")

